<div class="pnl1 mat-elevation-z8">
    <div class="head">
        <span class="title">Tareas por hacer</span>
    </div>
    <div class="ui-g">

        <!-- btn ver filtro -->
        <div class="ui-g-6 text-left pb-0 pt-0 pr-0 pl-0 d-flex align-items-center">
            <div class="mt-3 ml-3 mb-0 mr-0">
                <button (click)="toogleShowFilter()" class="btn-light-dark w-130-px" type="button" title="Oculta el panel de filtros de búsqueda">
                    <label class="btn-label">Ver Filtros</label>
                    <i [ngClass]="isShowFilter ? 'fa-arrow-circle-down' : 'fa-arrow-circle-up'" class="fa btn-icon font-size-20 pl-2"></i>
                </button>
            </div>
            <div class="mt-3 ml-3 mb-0 mr-0 ms-auto"> <!-- ms-auto para alinear a la derecha -->
                <button data-bs-toggle="modal" data-bs-target="#createTaskModal" class="btn-light-dark w-130-px" type="button">
                    <label class="btn-label">Crear Nueva Tarea</label>
                </button>
            </div>
        </div>
        
        
     

        <!-- panel filtros -->
        <ng-container *ngIf="isShowFilter">
            <div class="ui-g-12 ml-3 mr-3 p-0 mt-2">
                <!-- filtro por estado (radio buttons) -->
                <div class="ui-g-6">
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="estado" [(ngModel)]="filtro.estado" value="pendiente" />
                            Pendientes
                        </label>
                        <label>
                            <input type="radio" name="estado" [(ngModel)]="filtro.estado" value="completada" />
                            Completadas
                        </label>
                    </div>
                </div>

                <!-- btn limpiar - filtrar -->
                <div class="ui-g-3 pb-0 text-right pr-0">
                    <button (click)="limpiar()" class="btn-less mr-2" type="button"
                        title="Limpia los filtros de búsqueda ingresados">
                        <label class="btn-label"> Limpiar</label>
                        <i class="fa fa-times btn-icon pl-1"></i>
                    </button>
                    <button (click)="filtrar()" class="btn-light" type="button"
                        title="Filtra las tareas de acuerdo al estado">
                        <label class="btn-label"> Filtrar</label>
                        <i class="fa fa-filter btn-icon pl-1"></i>
                    </button>
                </div>
            </div>
        </ng-container>

        <!-- TAB - Tareas -->
        <div class="ui-g-12 p-3 mt-2 ml-2 mr-2 ">
            <ng-container *ngIf="tareas.length > 0">
                <p-table id="tbldeliveries" #tbldeliveries [responsive]="true" [paginator]="true" [lazy]="true"
                    styleClass="tbl-app" [value]="tareasFiltradas" [rows]="10" [rowsPerPageOptions]="[5, 10, 25]">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>Nombre Tarea</th>
                            <th>Responsable</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-tarea>
                        <tr>
                            <td>{{ tarea.nombreTarea }}</td>
                            <td>{{ tarea.responsable }}</td>
                            <td>{{ tarea.estado | titlecase }}</td>
                            <td>

                                <i (click)="editarTarea(tarea)" class="fa fa-pencil pencil" title="Editar "></i>
                                &nbsp;
                                <i (click)="eliminarTarea(tarea)" [ngClass]="'trash'" class="fa fa-trash"
                                    title="Eliminar ">
                                </i>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </ng-container>

            <ng-container *ngIf="tareas.length === 0">
                <p>No hay tareas que mostrar.</p>
            </ng-container>
        </div>
    </div>
</div>

<p-toast></p-toast>


<!-- Modal para crear/editar tarea -->
<div class="modal fade" id="createTaskModal" tabindex="-1" aria-labelledby="createTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Header del Modal -->
            <div class="modal-header">
                <h5 class="modal-title" id="createTaskModalLabel">{{ tareaSeleccionada ? 'Editar Tarea' : 'Crear Tarea' }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Cuerpo del Modal -->
            <div class="modal-body">
                <form (ngSubmit)="guardarTarea()" #taskForm="ngForm">
                    <div class="mb-3">
                        <label for="nombreTarea" class="form-label">Nombre de la tarea</label>
                        <input type="text" class="form-control" id="nombreTarea" [(ngModel)]="nuevaTarea.nombreTarea"
                            name="nombreTarea" required>
                    </div>

                    <div class="mb-3">
                        <label for="responsable" class="form-label">Responsable</label>
                        <input type="text" class="form-control" id="responsable" [(ngModel)]="nuevaTarea.responsable"
                            name="responsable" required>
                    </div>

                    <!-- Estado -->
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="estadoPendiente" name="estado"
                                [(ngModel)]="nuevaTarea.estado" value="pendiente" checked>
                            <label class="form-check-label" for="estadoPendiente">
                                Pendiente
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="estadoCompletada" name="estado"
                                [(ngModel)]="nuevaTarea.estado" value="completada">
                            <label class="form-check-label" for="estadoCompletada">
                                Completada
                            </label>
                        </div>
                    </div>

                    <!-- Botones del formulario -->
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">{{ tareaSeleccionada ? 'Actualizar Tarea' : 'Crear Tarea' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
